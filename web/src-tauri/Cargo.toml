[package]
name = "astrotool"
version = "0.29.1"
description = "Astrotool – pre-processing for planetary, lunar, solar and eclipse imaging"
authors = ["aisuisse"]
license = "GPL-3.0-or-later"
repository = "https://github.com/aisuisse/astrotool"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "astrotool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
