# Baut die Windows-App aus dem öffentlichen Quellcode (Voraussetzung für die Signatur über SignPath).
# Ablauf in zwei Stufen, damit die App selbst und der Installer signiert werden können:
#   1. astrotool.exe bauen (ohne Installer)   – später: signieren
#   2. Installer aus der (signierten) exe packen – später: signieren
# Ergebnis als Artefakt: Astrotool_<version>_x64-setup.exe und Astrotool_<version>_portable.exe
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    defaults:
      run:
        working-directory: web
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V

      - name: Abhängigkeiten
        run: npm ci

      - name: Einheitstests
        run: npm test

      - name: Version lesen
        id: ver
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: App bauen (ohne Installer)
        run: npm run app:build -- --no-bundle

      # Stufe 1 der Signatur (SignPath) kommt hierhin: target\release\astrotool.exe

      - name: Installer packen
        run: node scripts/tauri.mjs bundle --bundles nsis

      # Stufe 2 der Signatur (SignPath) kommt hierhin: der Installer

      - name: Dateien bereitstellen
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release\astrotool.exe" "$out\Astrotool_${v}_portable.exe"
          Copy-Item "$env:CARGO_TARGET_DIR\release\bundle\nsis\Astrotool_${v}_x64-setup.exe" "$out\Astrotool_${v}_x64-setup.exe"
          Get-ChildItem $out | Format-Table Name, Length
          Get-FileHash "$out\*.exe" -Algorithm SHA256 | Format-Table Hash, Path

      - uses: actions/upload-artifact@v4
        with:
          name: Astrotool_${{ steps.ver.outputs.version }}_windows
          path: out/*.exe
          if-no-files-found: error
